x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-employee-profile}-backend:latest
  pull_policy: never
  environment:
    PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
    SECRET_KEY: ${SECRET_KEY:?Variable not set}
    FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
    FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
    SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    # A missing variable is omitted, so Settings keeps its None default.
    FASTAPI_ENV:
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_TLS: ${SMTP_TLS:-true}
    SMTP_SSL: ${SMTP_SSL:-false}
    EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
    SENTRY_DSN: ${SENTRY_DSN:-}

services:
  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
      POSTGRES_DB: app

  prestart:
    <<: *backend
    command: bash scripts/prestart.sh
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["fastapi", "run", "--workers", "4"]
    depends_on:
      prestart:
        condition: service_completed_successfully
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["procrastinate", "--app=app.worker.app.app", "worker"]
    depends_on:
      prestart:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "procrastinate", "--app=app.worker.app.app", "healthchecks"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-db-data:
