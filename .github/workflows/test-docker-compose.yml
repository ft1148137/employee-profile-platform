name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Test demo stack and role permissions
        run: bash tests/smoke/compose_smoke.sh
      - if: always()
        run: docker compose down -v --remove-orphans

  test-production-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: shellcheck install.sh upgrade.sh backup.sh restore.sh deploy/common.sh deploy/backup/*.sh
      - name: Install without demo data
        env:
          EPP_ACCESS: http
          EPP_HTTP_PORT: '8080'
          COMPOSE_PROJECT_NAME: epp-production-ci
        run: |
          set -o pipefail
          ./install.sh --non-interactive | tee install-output.txt
          grep -q '/setup#token=' install-output.txt
      - name: Verify production install and idempotency
        run: |
          ! grep -q changethis .env
          grep -qx 'LOGIN_MAX_FAILURES_PER_IP=300' .env
          test "$(stat -c %a .env)" = 600
          test "$(docker compose exec -T db psql -U postgres -d app -tAc 'select count(*) from organization')" = 0
          test "$(docker compose exec -T db psql -U postgres -d app -tAc 'select count(*) from "user"')" = 0
          address=$(hostname -I | awk '{print $1}')
          curl --noproxy '*' -H 'Accept: text/html' -fsS "http://$address:8080/login" >/dev/null
          token=$(sed -n 's/.*\/setup#token=//p' install-output.txt)
          curl --noproxy '*' -fsS -X POST "http://$address:8080/api/v1/setup/initialize" \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$token\",\"org_name\":\"CI 测试企业\",\"admin_username\":\"admin\",\"admin_password\":\"synthetic-password-2026\"}" \
            | python3 -c 'import json,sys; result=json.load(sys.stdin); assert result["access_token"] and result["org_id"]'
          cp .env .env.before
          ./install.sh --non-interactive > reinstall-output.txt
          grep -q '企业已初始化' reinstall-output.txt
          ! grep -q '/setup#token=' reinstall-output.txt
          cmp .env .env.before
          file=$(./backup.sh)
          test -s "$file"
          test -r "$file"
          test "$(stat -c %u "$file")" = "$(id -u)"
          test "$(stat -c %a "$file")" = 600
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d app -c 'CREATE TABLE restore_probe(id int, org_id uuid REFERENCES organization(id)); INSERT INTO restore_probe SELECT 1, id FROM organization;'
          printf '确认恢复\n' | ./restore.sh "$file"
          test -z "$(docker compose exec -T db psql -U postgres -d app -tAc "select to_regclass('public.restore_probe')")"
          test "$(docker compose exec -T db psql -U postgres -d app -tAc 'select count(*) from organization')" = 1
          curl --noproxy '*' -fsS "http://$address:8080/api/v1/utils/health-check/" >/dev/null
      - name: Stop test stack
        if: always()
        run: docker compose down -v --rmi local --remove-orphans
