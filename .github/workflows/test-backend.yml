name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '17 19 * * *'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: .github/ci-paths.yml
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: deploy
        with:
          filters: .github/ci-deploy-paths.yml

  backend-shard:
    needs: backend-changes
    if: needs.backend-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --prefix pi --ignore-scripts --no-audit --no-fund
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - run: docker compose -f compose.yml -f compose.dev.yml down -v --remove-orphans
      - run: docker compose -f compose.yml -f compose.dev.yml up -d --wait db
      - name: Install dependencies and compile bytecode before coverage
        run: uv sync --all-packages --frozen --compile-bytecode
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        env:
          FASTAPI_ENV: development
          SHARD: ${{ matrix.shard }}
        run: >-
          uv run pytest tests/ -n auto --dist loadgroup --cov --cov-report=
          -m "not roster_performance" --splits=3 --group="$SHARD"
          --splitting-algorithm=least_duration --durations=25
          --junitxml="junit-$SHARD.xml"
        working-directory: backend
      - name: Run roster performance tests without workers or coverage
        if: matrix.shard == 1
        run: uv run pytest tests/domains/roster/test_parser.py -m roster_performance -n 0 --no-cov -x -q --durations=6
        working-directory: backend
        env:
          FASTAPI_ENV: development
      - if: always()
        run: docker compose -f compose.yml -f compose.dev.yml down -v --remove-orphans
      - name: Save shard coverage with a unique filename
        env:
          SHARD: ${{ matrix.shard }}
        run: mv backend/.coverage "backend/.coverage.$SHARD"
      - name: Store coverage data and test counts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: backend-coverage-${{ matrix.shard }}
          path: |
            backend/.coverage.*
            backend/junit-*.xml
          include-hidden-files: true
          if-no-files-found: error

  test-backend:
    needs: [backend-changes, backend-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all shards or a successful path filter
        env:
          FILTER: ${{ needs.backend-changes.result }}
          CHANGED: ${{ needs.backend-changes.outputs.changed }}
          TESTS: ${{ needs.backend-shard.result }}
        run: bash .github/scripts/require-tests.sh "$FILTER" "$CHANGED" "$TESTS"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.backend-changes.outputs.changed == 'true'
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: needs.backend-changes.outputs.changed == 'true'
        with:
          version: "latest-known"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.backend-changes.outputs.changed == 'true'
        with:
          pattern: backend-coverage-*
          path: backend
          merge-multiple: true
      - name: Combine all three shards and enforce total coverage
        if: needs.backend-changes.outputs.changed == 'true'
        working-directory: backend
        run: |
          test "$(find . -maxdepth 1 -name '.coverage.*' | wc -l)" -eq 3
          uv run coverage combine
          uv run coverage report --fail-under=90
          uv run coverage html
      - name: Store coverage report
        if: needs.backend-changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
