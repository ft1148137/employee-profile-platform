name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --prefix pi --ignore-scripts --no-audit --no-fund
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - run: docker compose -f compose.yml -f compose.dev.yml down -v --remove-orphans
      - run: docker compose -f compose.yml -f compose.dev.yml up -d --wait db
      - name: Install dependencies and compile bytecode before coverage
        run: uv sync --all-packages --frozen --compile-bytecode
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        env:
          PYTEST_ADDOPTS: '-m "not roster_performance"'
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - name: Run roster performance tests without workers or coverage
        run: uv run pytest tests/domains/roster/test_parser.py -m roster_performance -n 0 --no-cov -x -q --durations=6
        working-directory: backend
        env:
          FASTAPI_ENV: development
      - if: always()
        run: docker compose -f compose.yml -f compose.dev.yml down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend
