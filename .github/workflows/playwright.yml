name: Playwright Tests

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false
    # For pull requests it's not necessary to checkout the code but for the main branch it is
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          changed:
            - backend/**
            - frontend/**
            - .env.example
            - compose*.yml
            - .github/workflows/playwright.yml

  playwright-shard:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: epp-playwright-ci
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: cp .env.example .env
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.12
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "latest-known"
    - run: uv sync
      working-directory: backend
    - run: bun ci
      working-directory: frontend
    - run: bash scripts/generate-client.sh
    - name: Install Chromium on the runner
      run: bunx playwright install --with-deps chromium
      working-directory: frontend
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build test images with cache
      uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
      with:
        source: .
        files: |
          compose.yml
          compose.dev.yml
        load: true
        targets: backend,pi
        set: |
          backend.cache-from=type=gha,scope=playwright-backend
          backend.cache-to=type=gha,scope=playwright-backend,mode=max
          pi.cache-from=type=gha,scope=playwright-pi
          pi.cache-to=type=gha,scope=playwright-pi,mode=max
    - name: Verify Compose image names
      run: docker image inspect "${COMPOSE_PROJECT_NAME}-backend:latest" "${COMPOSE_PROJECT_NAME}-pi:latest" > /dev/null
    - run: docker compose -f compose.yml -f compose.dev.yml down -v --remove-orphans
    - name: Start test services from the built images
      run: docker compose -f compose.yml -f compose.dev.yml up -d --no-build --wait backend worker mock-jira
    - name: Run Playwright tests
      working-directory: frontend
      env:
        SHARD: ${{ matrix.shard }}
        PLAYWRIGHT_BASE_URL: http://localhost:8000
        VITE_API_URL: http://localhost:8000
        PLAYWRIGHT_HTML_OUTPUT_DIR: blob-report
      run: MODEL_TEST_HOST="$(hostname -I | awk '{print $1}')" bunx playwright test --shard="$SHARD/3" --fail-on-flaky-tests --trace=retain-on-failure --reporter=html
    - if: always()
      run: docker compose -f compose.yml -f compose.dev.yml down -v --remove-orphans
    - name: Upload HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report-${{ matrix.shard }}
        path: frontend/blob-report
        include-hidden-files: true
        retention-days: 7

  test-playwright:
    needs: [changes, playwright-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - name: Require every shard or a successful path filter
      env:
        CHANGES_RESULT: ${{ needs.changes.result }}
        CHANGED: ${{ needs.changes.outputs.changed }}
        TEST_RESULT: ${{ needs.playwright-shard.result }}
      run: |
        test "$CHANGES_RESULT" = success
        if [ "$CHANGED" = true ]; then
          test "$TEST_RESULT" = success
        else
          test "$CHANGED" = false
          test "$TEST_RESULT" = skipped
        fi
