name: Playwright Tests

on:
  push:
    branches:
    - master
  pull_request:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ github.event_name != 'pull_request' || steps.filter.outputs.playwright == 'true' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      if: github.event_name == 'pull_request'
      id: filter
      with:
        predicate-quantifier: every
        filters: .github/ci-paths.yml
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      if: github.event_name == 'pull_request'
      id: deploy
      with:
        filters: .github/ci-deploy-paths.yml

  playwright-prepare:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: epp-playwright-ci
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: cp .env.example .env
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.12
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "latest-known"
    - run: uv sync
      working-directory: backend
    - run: bun ci
      working-directory: frontend
    - run: bash scripts/generate-client.sh
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: chromium
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'frontend/package.json') }}
    - name: Download Chromium once
      if: steps.chromium.outputs.cache-hit != 'true'
      run: bunx playwright install chromium
      working-directory: frontend
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Build test images with cache
      uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
      with:
        source: .
        files: |
          compose.yml
          compose.dev.yml
        load: true
        targets: backend,pi
        set: |
          backend.cache-from=type=gha,scope=playwright-backend
          backend.cache-to=type=gha,scope=playwright-backend,mode=max
          pi.cache-from=type=gha,scope=playwright-pi
          pi.cache-to=type=gha,scope=playwright-pi,mode=max
    - name: Verify Compose image names
      run: docker image inspect "${COMPOSE_PROJECT_NAME}-backend:latest" "${COMPOSE_PROJECT_NAME}-pi:latest" > /dev/null
    - name: Export images and generated client for every shard
      run: |
        set -o pipefail
        docker save "${COMPOSE_PROJECT_NAME}-backend:latest" "${COMPOSE_PROJECT_NAME}-pi:latest" | zstd -T0 -3 -o /tmp/playwright-images.tar.zst
        tar -czf /tmp/playwright-client.tar.gz -C frontend/src client
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-prepared
        path: /tmp/playwright-*.tar.*
        compression-level: 0
        retention-days: 1
        if-no-files-found: error

  playwright-shard:
    needs: [changes, playwright-prepare]
    if: needs.changes.outputs.changed == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: epp-playwright-ci
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: cp .env.example .env
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.12
    - run: bun ci
      working-directory: frontend
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'frontend/package.json') }}
    - name: Install Chromium system dependencies and recover a missing cache
      run: bunx playwright install --with-deps chromium
      working-directory: frontend
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: playwright-prepared
        path: /tmp/playwright-prepared
    - name: Load prepared images and generated client
      run: |
        set -o pipefail
        zstd -dc /tmp/playwright-prepared/playwright-images.tar.zst | docker load
        tar -xzf /tmp/playwright-prepared/playwright-client.tar.gz -C frontend/src
        docker image inspect "${COMPOSE_PROJECT_NAME}-backend:latest" "${COMPOSE_PROJECT_NAME}-pi:latest" > /dev/null
    - run: docker compose -f compose.yml -f compose.dev.yml down -v --remove-orphans
    - name: Start test services from the built images
      run: docker compose -f compose.yml -f compose.dev.yml up -d --no-build --wait backend worker mock-jira
    - name: Run Playwright tests
      working-directory: frontend
      env:
        SHARD: ${{ matrix.shard }}
        PLAYWRIGHT_BASE_URL: http://localhost:8000
        VITE_API_URL: http://localhost:8000
        PLAYWRIGHT_HTML_OUTPUT_DIR: blob-report
      run: MODEL_TEST_HOST="$(hostname -I | awk '{print $1}')" bunx playwright test --shard="$SHARD/3" --fail-on-flaky-tests --trace=retain-on-failure --reporter=html
    - if: always()
      run: docker compose -f compose.yml -f compose.dev.yml down -v --remove-orphans
    - name: Upload HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report-${{ matrix.shard }}
        path: frontend/blob-report
        include-hidden-files: true
        retention-days: 7

  test-playwright:
    needs: [changes, playwright-prepare, playwright-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Require preparation and every shard or a successful path filter
      env:
        FILTER: ${{ needs.changes.result }}
        CHANGED: ${{ needs.changes.outputs.changed }}
        PREPARE: ${{ needs.playwright-prepare.result }}
        TESTS: ${{ needs.playwright-shard.result }}
      run: bash .github/scripts/require-tests.sh "$FILTER" "$CHANGED" "$PREPARE" "$TESTS"
