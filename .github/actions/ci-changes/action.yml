name: CI path filters
description: Fail closed on unknown paths and run everything outside pull requests
outputs:
  runtime:
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true' }}
    description: Backend and Compose tests
  playwright:
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs.playwright == 'true' }}
    description: Browser tests
  production:
    value: ${{ github.event_name != 'pull_request' || steps.deploy.outputs.changed == 'true' || steps.filter.outputs.unknown == 'true' }}
    description: Production installation tests
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      if: github.event_name == 'pull_request'
      id: filter
      with:
        predicate-quantifier: every
        filters: |
          runtime:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!.github/ISSUE_TEMPLATE/**'
          playwright:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!.github/ISSUE_TEMPLATE/**'
            - '!pi/**'
          unknown:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!.github/ISSUE_TEMPLATE/**'
            - '!backend/**'
            - '!frontend/**'
            - '!pi/**'
            - '!examples/**'
            - '!templates/**'
            - '!connectors/**'
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      if: github.event_name == 'pull_request'
      id: deploy
      with:
        filters: |
          changed:
            - 'compose*.yml'
            - '**/Dockerfile*'
            - 'install.sh'
            - 'upgrade.sh'
            - 'backup.sh'
            - 'restore.sh'
            - 'deploy/**'
            - '.env.example'
            - '.github/workflows/test-docker-compose.yml'
