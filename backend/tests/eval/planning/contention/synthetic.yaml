# Every role row is [skill(+required extra), start week, weeks, %, headcount, predecessor role number].
# "skills" lists senior employees. Others are junior. "unavailable" lists individual day offsets.
# All cases require full headcount, senior capability, full allocation and duration,
# time after the predecessor finishes, and no weekly over-allocation including leave.
- id: trap-primary
  constraint: Person 1 alone meets key; general role can use person 2.
  people: 8
  newcomers: [2, 8]
  other: {1: 0}
  unavailable: {6: [0, 1, 2, 3, 4]}
  skills: {general: [1, 2], key: [1], review: [3, 4, 6], launch: [5, 7, 8]}
  projects:
    - [[general, 0, 2, 60, 1, 0], [review, 1, 1, 50, 1, 1], [launch, 1, 1, 50, 1, 0]]
    - [[key, 0, 2, 60, 1, 0], [review, 2, 1, 50, 1, 1], [launch, 0, 2, 50, 1, 0]]
- id: trap-extra
  constraint: Only person 1 has both senior backend and security. Person 3 can take general backend.
  people: 9
  newcomers: [3, 7]
  other: {1: 0, 2: 20}
  unavailable: {5: [0, 1, 2]}
  skills: {backend: [1, 2, 3], security: [1, 4], test: [5, 6, 7], release: [8, 9]}
  projects:
    - [[backend, 0, 2, 60, 1, 0], [test, 1, 1, 40, 2, 1], [release, 3, 1, 50, 1, 2]]
    - [[backend+security, 0, 2, 60, 1, 0], [test, 0, 1, 40, 1, 0], [release, 2, 1, 50, 1, 1]]
- id: trap-headcount
