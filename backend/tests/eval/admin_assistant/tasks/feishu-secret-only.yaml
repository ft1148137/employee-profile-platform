id: feishu-secret-only
menu: connections
steps:
  - {type: say, text: 只换飞书的应用密钥 App Secret，保留原来的应用编号、关闭状态和邮箱自动绑定。给我安全输入框和确认卡，不要测试连接}
  - {type: secret, field: app_secret}
  - {type: apply}
  - type: say
    text: 重新查询飞书设置，现在的开关和邮箱自动绑定是否保持原值？不要显示任何凭据
    capture:
      updated_at: {tool: admin_read, path: [data, 0, updated_at]}
expect:
  services:
    - function: get_im_settings
      args: {}
      value:
        - {platform: feishu, enabled: false, email_auto_bind: true, has_credentials: true, updated_at: "${updated_at}"}
        - {platform: wecom, enabled: false, email_auto_bind: true, has_credentials: false, updated_at: null}
        - {platform: telegram, enabled: false, email_auto_bind: false, has_credentials: false, updated_at: null}
