  - {type: apply}
  - {type: say, text: 新增员工，工号 EVAL001，姓名合成员工，邮箱 eval001@example.com，部门验收部，岗位序列研发，工作地点上海，入职日期2026-01-01，不设直属上级，给我确认卡}
