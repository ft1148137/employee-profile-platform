      - name: propose_changes
        args:
          items:
            - function: onboard_employee
              args: {employee_code: EVAL001, display_name: 合成员工, email: eval001@example.com, department: 验收部, job_family: 研发, work_location: 上海, hire_date: '2026-01-01'}
