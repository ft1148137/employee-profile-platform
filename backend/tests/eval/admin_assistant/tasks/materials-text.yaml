expect: {material_requests: 1}
fake_model:
  - calls:
      - name: propose_changes
        args:
          items:
            - function: draft_profiles_from_material
              args:
                materials: [{attachment_id: null, label: 管理员口头材料}]
                people:
                  - employee_email: '${employee_email}'
                    items: [{capability_key: '${capability}', statement: 参与电路设计, basis: 管理员口头材料, uncertainty: 不确定是否独立完成}]
