    text: '为邮箱 ${employee_email} 的员工整理初始画像：能力 ${capability}，陈述为参与电路设计，依据为本次管理员口头材料；不确定是否独立完成，不推断等级。只处理这一人，先给确认卡，本人过目前不得发布。'
