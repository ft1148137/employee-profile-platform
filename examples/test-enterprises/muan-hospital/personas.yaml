  refs: ['manager_review:MR03', 'manager_review:MR14']
  note: 金雪 2026-09-07 入职、黎向晚 2026-08-17 入职，都不出现在任何工作记录（含 participants），也没有自述。系统能看到的只有两条 not_sure 的经理评价，画像必须是未知而不是不会。
