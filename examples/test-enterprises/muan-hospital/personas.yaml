  refs: ['record:PB-0016', 'record:JX-0009']
  note: 周子珩在排班和继续教育系统里的显示名是 Jerry Zhou，与花名册的中文名并存。按显示名聚合会把同一个人拆成两条画像。
- tag: dept_and_project_lead
  employees: [MA001, MA019]
  refs: ['record:JX-0011', 'record:JX-0012']
  note: 云嘉树既是心血管内科主任又是心衰 MDT 协作组负责人；邵令仪既是医务部主任又是手术分级授权管理规范修订的负责人。部门负责人与项目负责人两种身份叠加，权限和评价人判定都要测。
- tag: pm_not_dept_manager
  employees: [MA025]
  refs: ['record:ZK-0008', 'record:ZK-0016']
  note: 岑屹是电子病历质控系统升级项目的项目经理，但不是任何部门的负责人，他的直属上级是信息中心主任。项目成员里还有医务部的人，跨部门评价权需要按项目关系授予。
- tag: colloquial
  employees: [MA005, MA013]
  refs: ['self_report:SR02', 'self_report:SR12']
  note: 谭䶮的自述用语音转文字，口语化、有错别字；宋亦是实习护生，自述零散、爱用「老师」「跟班」这类说法。两人的自述都需要系统能接受非书面语并正确引用。
