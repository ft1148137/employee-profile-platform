  employees: [MA013]
  refs: ['record:PB-0010', 'record:JX-0005']
  note: 宋亦是在校护理实习生，排班里只写跟班、不单独值守，培训记录明确不计学分，不应被纳入可调配资源。
- tag: assignee_mismatch
  employees: [MA003, MA005, MA008, MA009]
  refs: ['record:SS-0010', 'record:ZK-0002', 'record:ZK-0011']
  note: 两类错配。一是手术挂名：SS-0010 登记主刀为科主任褚衡（MA008），实际全部操作由主治医师李沐（MA009）完成，科主任仅在台指导，ZK-0011 的签名不一致说的是同一台手术。二是质控扣分归属：ZK-0002 按制度把扣分记在主管医师沈砚（MA003）名下，病历实际由规培医师谭䶮（MA005）书写。
- tag: cross_source_duplicate
  employees: [MA008, MA009, MA010]
  refs: ['record:SS-0010', 'record:ZK-0011']
  note: 同一台腹腔镜胆囊切除术（手术编号 OP-2026-0708）在手术记录里是 SS-0010，在病历质控里以病案号 BAH-2026-0802 出现为 ZK-0011。两条记录对主刀是谁的说法不一致，不去重会把一台手术算成两台。
- tag: review_conflict
  employees: [MA009, MA015]
  refs: ['self_report:SR03', 'manager_review:MR04', 'self_report:SR04', 'manager_review:MR05']
  note: 李沐自述能承担四级手术，科主任只认到常规三级；艾力·买买提自述能独立主持复杂抢救，科主任认为仍需协助。两组自述与评价直接矛盾，系统不应强行二选一。
- tag: appeal
  employees: [MA003, MA015]
  refs: ['manager_review:MR01', 'manager_review:MR05', 'manager_review:MR18']
  note: 沈砚认为质控扣分不该记成自己的病历书写水平，也不认可按过期证书判断介入能力，会去申诉；艾力·买买提不接受「复杂抢救需要协助」的结论，自述里已经写明要申诉。
- tag: manager_unsure
  employees: [MA005, MA007, MA026]
  refs: ['manager_review:MR02', 'manager_review:MR03', 'manager_review:MR14']
  note: 三条 not_sure。谭䶮的书写样本太少无法判断；金雪和黎向晚入职不久、系统里没有记录，经理明确表示不确定而不是评低。
- tag: ethnic_minority_name
  employees: [MA004, MA015]
  refs: ['record:JX-0004', 'record:PB-0004']
  note: 其木格是蒙古族姓名，没有姓氏结构；艾力·买买提是维吾尔族姓名，带间隔号。两者在姓名拆分、拼音邮箱生成、搜索和 CSV 导出里都容易出问题，艾力·买买提的继续教育账号还是拼音用户名。
- tag: rare_character
  employees: [MA005]
  refs: ['record:PB-0011', 'record:ZK-0002']
  note: 谭䶮的「䶮」是 U+4D6E，属 CJK 统一汉字扩展 A 区，仍在基本多文种平面（BMP）内，UTF-8 占 3 字节，不是 4 字节字符。需要测试字体缺字、搜索分词、CSV 导出与邮件标题编码。
- tag: english_name
