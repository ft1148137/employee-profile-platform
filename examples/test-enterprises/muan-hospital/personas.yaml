- tag: same_name
  employees: [MA002, MA009]
  refs: ['record:SS-0002', 'record:SS-0011', 'record:PB-0013']
  note: 两位医师都叫李沐。一位在心血管内科（工号 YG20114、术者编码 DR-1023），一位在普通外科（工号 YG20327、术者编码 DR-2014）。手术记录系统里显示名完全相同，只能靠账号区分；两人的手术类型完全不同，混淆后会同时出现高估和错配。
- tag: multi_account
  employees: [MA002, MA009, MA010, MA015]
  refs: ['record:SS-0009', 'record:JX-0004', 'record:SS-0002', 'record:PB-0013']
  note: 医师在排班、病历质控、继续教育里用院内工号，在手术记录里用术者编码，属于同一人的两个账号。傅行舟还有第三个未登记的旧术者编码 DR-2108；艾力·买买提的继续教育账号是拼音用户名 aili.maimaiti。
- tag: unlinked_account
  employees: []
  refs: ['record:PB-0007', 'record:SS-0006']
  note: PB-T07 是急诊科共用排班终端账号，DR-9001 是外院指导专家的临时术者编码。两者都在来源数据里出现过，都不属于任何员工，系统不应为它们生成画像。
- tag: transfer
