- tag: concurrent_post
  employees: [MA010]
  refs: ['record:ZK-0005', 'record:ZK-0011', 'record:SS-0013']
  note: 傅行舟主岗在普通外科，兼任医务部病案质控医师，第二汇报人是医务部主任。手术记录和病历质控里都有他，两类能力必须分开呈现。
