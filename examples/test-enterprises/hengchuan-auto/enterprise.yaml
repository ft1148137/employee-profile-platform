departments:
- name: 机加工车间
  pcf_categories: ['4.0 Deliver Physical Products']
  responsibilities: 制动卡钳支架、转向齿条等机加工件的批量生产、换型与报工
- name: 质量部
  pcf_categories: ['4.0 Deliver Physical Products', '11.0 Manage Enterprise Risk, Compliance, Remediation, and Resiliency']
