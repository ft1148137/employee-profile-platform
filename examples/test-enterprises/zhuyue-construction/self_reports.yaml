- id: SR01
  employee_code: ZY001
  submitted_at: '2026-09-22T20:10:00+08:00'
  text: 栖湖花园今年从地下室做到主体封顶，进度计划重排过两次，一次是设计变更，一次是钢筋班人手不够。台风前我决定高处作业停两天，书面通知了监理和分包。总进度计划是我自己排的，但公司没有计划系统，只能在例会记录里看到结论。
  related_task_keys: [RZ-0012, RZ-0024, AQ-0014]
- id: SR02
  employee_code: ZY002
  submitted_at: '2026-09-25T18:40:00+08:00'
  text: 今年我编了二次结构、砌体和后浇带三个分项的施工方案，并做了书面技术交底。砌体交底时班组长提了洞口过梁的问题，我现场补了做法图示。质量验收系统只给我开了提交权限，很多检验批其实是质量员做的，我只是签认。
  related_task_keys: [RZ-0014, ZL-0012]
- id: SR03
  employee_code: ZY003
  submitted_at: '2026-10-08T19:20:00+08:00'
  text: 主体阶段高峰期土建、机电、外架三家一起干，作业面都是我排的，我觉得我已经可以独立组织复杂的多专业穿插施工了。日志我每天都写，整改要求也都落到班组。
  related_task_keys: [RZ-0009, RZ-0013, RZ-0019, RZ-0025]
- id: SR04
  employee_code: ZY004
  submitted_at: '2026-10-12T19:05:00+08:00'
  text: 五月老蔺走了以后机电这边的活都归我，未完工程量我和分包一条一条对过。有一条日志因为格式不对被退回了，内容是真的做了。给水试压和户内管道我能自己报验，临电的事我只负责按安全员的通知整改，判定不是我做的。
  related_task_keys: [RZ-0016, ZL-0009, RZ-0026, AQ-0005]
- id: SR05
  employee_code: ZY005
  submitted_at: '2026-10-16T17:30:00+08:00'
  text: 三季度资料归档核对我列了 38 项缺项，逐项追补完。去年四季度的纸质日志由实习生扫描，我核对了缺页。另外有一条机电复工检查的日志是我代录的，内容是郝工口述的，不是我自己去看的。
  related_task_keys: [ZL-0016, RZ-0022, RZ-0008]
- id: SR06
  employee_code: ZY006
  submitted_at: '2026-10-19T20:45:00+08:00'
  text: 我是木工班的班长，带十六七个人，模板搭设拆除周转都是我安排的。那个表格我不会填，都是用语音说的，字可能打错了。架子的证过期了没换，现在不让我干架子活了，但支撑体系怎么搭我是懂的。
  related_task_keys: [RZ-0007, RZ-0010]
- id: SR07
  employee_code: ZY007
  submitted_at: '2026-10-20T21:10:00+08:00'
  text: 钢筋班我带的，活都弄好了，没啥事。上工前我都跟工人讲一遍注意啥，签字是施工员签的。系统里头的东西我不太会弄，这段话是让人帮我说进去的。
  related_task_keys: [RZ-0020]
- id: SR08
  employee_code: ZY008
  submitted_at: '2026-10-09T17:50:00+08:00'
  text: 项目的平面控制网和高程控制网是我建的，每层轴线投测和标高传递都做闭合校核。封顶后沉降观测有两个点数据偏大，我把观测频次加密了并报了总工。全高垂直度逐层复核的数据都在验收系统里。
  related_task_keys: [RZ-0004, RZ-0023, ZL-0013]
- id: SR09
  employee_code: ZY010
  submitted_at: '2026-10-21T18:15:00+08:00'
  text: 今年外架连墙件缺失和屋面动火两件事都是我发现、下通知、复查关闭的，整改前后照片都留了。还有一点，项目部有位同事和我同名，他的施工日志不是我的工作，希望系统能分开。
  related_task_keys: [AQ-0007, AQ-0008, AQ-0012, AQ-0013]
- id: SR10
  employee_code: ZY011
  submitted_at: '2026-10-22T19:40:00+08:00'
  text: 砌体检验批和监理对灰缝饱满度口径不一致，是我组织扩大检查、委托第三方检测，最后按让步接收处理并留了记录。后浇带隐蔽验收的复尺和评定也是我做的，但系统只给总工开了提交权限，记录上的人不是我。希望能按实际贡献者算，而不是按提交账号算。
  related_task_keys: [ZL-0014, ZL-0012, ZL-0001, ZL-0006]
- id: SR11
  employee_code: ZY012
  submitted_at: '2026-10-23T18:00:00+08:00'
  text: 维保项目一年就那么几个作业面，检查记录自然比大项目少。吊篮作业、临电、消防通道这三件事我都是自己查、自己下通知、自己复查关闭的。记录条数少不代表我只能在别人帮助下干活。
  related_task_keys: [AQ-0010, AQ-0015, AQ-0016]
- id: SR12
  employee_code: ZY013
  submitted_at: '2026-10-13T16:20:00+08:00'
  text: 去年十二月我从项目部资料员转到安全质量部做试验检测，现在主要做试块和材料报验，检验批评定还要质量员带着。做资料员那三年的台账现在系统里基本看不到了。
  related_task_keys: [ZL-0005, RZ-0004]
- id: SR13
  employee_code: ZY015
  submitted_at: '2026-10-10T17:10:00+08:00'
  text: 维保与小型改造这一摊归我管，云岭苑外墙渗漏维修从进场到验收是我统筹的，安全检查和屋面防水隐蔽验收我都参加了。我有一级建造师，但确实还没独立带过在建的大体量住宅项目。
  related_task_keys: [RZ-0017, AQ-0015, ZL-0011]
- id: SR14
  employee_code: ZY016
  submitted_at: '2026-10-14T15:40:00+08:00'
  text: 钢筋保护层偏薄的返工处置方案是我出的，明确了剔凿范围、修补做法和扩大抽检要求。砌体检验批争议我参与了技术论证，但主办是质量员。
  related_task_keys: [ZL-0008, ZL-0014]
- id: SR15
  employee_code: ZY017
  submitted_at: '2026-10-15T18:25:00+08:00'
  text: 四月我从项目部转到工程管理部。转岗前在项目部组织机电穿插、做管井隐蔽验收，转岗后做技术支持和维保项目的配电箱改造验收。我有建筑电工操作证，但现在不做现场临电管理。
  related_task_keys: [RZ-0011, ZL-0007, ZL-0015]
- id: SR16
  employee_code: ZY018
  submitted_at: '2026-10-17T16:50:00+08:00'
  text: 地下车库照明改造我用模型复核了桥架路由，现场实测和模型差了两处，我更新模型重新出图。方案主体还是工程师写的，我只写了管综部分。现场验收我跟过，没独立做过。
  related_task_keys: [RZ-0018, AQ-0016]
- id: SR17
  employee_code: ZY021
  submitted_at: '2026-10-18T17:05:00+08:00'
  text: 维保项目的计量口径是我和甲方核的，清单缺项和材料调差我自己处理过几轮。不过这些都在商务台账里，施工类系统里只有一条进场记录，所以画像上大概看不出来。
  related_task_keys: [RZ-0017]
- id: SR18
  employee_code: ZY020
  submitted_at: '2026-10-20T16:30:00+08:00'
  text: 分包月度计量我每月去现场签认一次，七月那次和施工员一起做的。常规劳务分包合同条款我能自己起草，索赔那次我只做了证据资料整理。
  related_task_keys: [RZ-0019, RZ-0012]
