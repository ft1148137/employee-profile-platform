  pcf_categories:
  - 4.0 Deliver Physical Products
  - 10.0 Acquire, Construct, and Manage Assets
  responsibilities: 元器件选型与二供导入、BOM 与 ECN 管理、DFM 评审、EMS 代工厂对接与试产
  capability_keys:
  - ecn_bom_management
  - dfm_review
- name: 综合管理部
  pcf_categories:
  - 7.0 Develop and Manage Human Capital
  - 8.0 Manage Information Technology (IT)
  responsibilities: 人力与培训档案、行政与办公采购、内部 IT 与 Jira/PLM 系统管理
