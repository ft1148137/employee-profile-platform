  capability_keys:
  - model_training
  - rknn_conversion
  - npu_performance_tuning
  - edge_integration
- name: 测试与认证部
  pcf_categories:
  - 2.0 Develop and Manage Products and Services
  - 11.0 Manage Enterprise Risk, Compliance, Remediation, and Resiliency
  responsibilities: 系统与固件测试、EMC 整改、环境与可靠性试验、第三方认证送检与工厂检查
  capability_keys:
