  text: 我在滨江店前台干了快四年，长短款自己能核出来，挂单退单也不用叫人。有一笔重复扣款的冲正记录不是我做的，那是南湖店和我同名的那位同事，她那台机器是 POS-NH-02，我是 POS-BJ-03，希望能查清楚别算到我头上。服务台退换货基本都是我在接，可是服务台那台机器是公用号，看不出来是谁做的。
