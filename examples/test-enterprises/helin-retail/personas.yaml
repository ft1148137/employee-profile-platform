# 测试用，不导入系统
# 真实能力（ground truth）用于核对系统推断的画像，对应计划书 §10.1「关键能力核实准确率」。
# 本企业的设计意图：门店一线的真实能力大量落在三个来源之外（口头交接、现场处置、代填表单），
# 巡店扣分又集中记在店长名下，系统很容易把「门店得分」当成「店长个人能力」。
