services:

  proxy:
    image: traefik:v3.7
    restart: unless-stopped
    ports:
      # Listen on port 80, default for HTTP, necessary to redirect to HTTPS
      - "${HTTP_PORT:-80}:80"
      # Listen on port 443, default for HTTPS
      - "443:443"
    volumes:
      # Mount the volume to store the certificates
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/certificates
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Ignore containers belonging to other Compose projects on this daemon.
      - --providers.docker.constraints=Label(`com.docker.compose.project`, `${COMPOSE_PROJECT_NAME:?Variable not set}`)
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Redirect all HTTP traffic to HTTPS
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Store the Let's Encrypt certificates in the mounted volume
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?Variable not set}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      # HTTP-01 requires this entrypoint to be reachable on public port 80.
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=http
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}
      # The backend has no published ports; only Traefik forwards client traffic.
      FORWARDED_ALLOW_IPS: "*"
    labels:
      - traefik.enable=true
      - traefik.http.services.${COMPOSE_PROJECT_NAME:?Variable not set}-backend.loadbalancer.server.port=8000
      - traefik.http.services.${COMPOSE_PROJECT_NAME:?Variable not set}-backend.loadbalancer.responseforwarding.flushinterval=-1ms
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:?Variable not set}-backend-https.service=${COMPOSE_PROJECT_NAME:?Variable not set}-backend
      # Route HTTPS traffic for this domain
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:?Variable not set}-backend-https.rule=Host(`${DOMAIN:?Variable not set}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:?Variable not set}-backend-https.tls=true
      # Use the Let's Encrypt resolver
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:?Variable not set}-backend-https.tls.certresolver=le

volumes:
  # Create a volume to store the certificates, even if the container is recreated
  traefik-certificates:
