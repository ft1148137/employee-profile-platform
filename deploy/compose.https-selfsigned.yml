services:

  proxy:
    image: traefik:v3.7
    restart: unless-stopped
    ports:
      # Listen on port 80, default for HTTP, necessary to redirect to HTTPS
      - "${HTTP_PORT:-80}:80"
      # Listen on port 443, default for HTTPS
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Redirect all HTTP traffic to HTTPS
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}
      # The backend has no published ports; only Traefik forwards client traffic.
      FORWARDED_ALLOW_IPS: "*"
    labels:
      - traefik.enable=true
      - traefik.http.services.backend.loadbalancer.server.port=8000
      - traefik.http.services.backend.loadbalancer.responseforwarding.flushinterval=-1ms
      # Route HTTPS traffic for this domain
      - traefik.http.routers.backend-https.rule=PathPrefix(`/`)
      - traefik.http.routers.backend-https.entrypoints=https
      - traefik.http.routers.backend-https.tls=true
