services:
  db:
    restart: unless-stopped
  backend:
    restart: unless-stopped
    environment:
      FASTAPI_ENV: !reset null
    ports: !override
      - "${API_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8000"
  worker:
    restart: unless-stopped
    environment:
      FASTAPI_ENV: !reset null
  # Do not inherit a developer's exported environment in a production install.
  prestart:
    environment:
      FASTAPI_ENV: !reset null
  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: app
      PGPASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
      TZ: ${TZ:-Asia/Shanghai}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-}
    volumes:
      - ./backups:/backups
      - ./deploy/backup/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["bash", "/backup-loop.sh"]
